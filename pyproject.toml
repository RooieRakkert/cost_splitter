[project]
name = "cost-splitter"
version = "0.1.0"
description = "Interactive CLI tool for splitting shared expenses"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "InquirerPy>=0.3.4",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
cost-splitter = "cost_splitter.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
